name: Weekly training report

on:
  schedule:
    # 04:00 UTC every Monday = 06:00 SAST
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Rewrite this week's review even if one exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the report
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python scripts/run_weekly.py ${{ inputs.force && '--force' || '' }}

      - name: Commit the new report
        run: |
          git config user.name "training-bot"
          git config user.email "actions@github.com"
          git add docs data
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Training report for week ending $(date -u +%Y-%m-%d)"
            git push
          fi
